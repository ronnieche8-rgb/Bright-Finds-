<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seller Dashboard - Bright Finds</title>

  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .dashboard {
      padding: 4rem 10%;
    }

    .dashboard-header {
      margin-bottom: 2rem;
    }

    .dashboard-header h1 {
      color: var(--pastel-blue-dark);
      margin-bottom: 0.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--white);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .stat-card h3 {
      color: var(--pastel-blue-dark);
      margin-bottom: 0.5rem;
    }

    .stat-card p {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .dashboard-section {
      background: var(--white);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      overflow-x: auto;
    }

    .dashboard-section h2 {
      color: var(--pastel-blue-dark);
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      color: var(--pastel-blue-dark);
    }

    .status {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: capitalize;
      background: var(--pastel-yellow);
    }

    .empty-message {
      color: #777;
      padding: 1rem 0;
    }

    .back-button {
      margin-top: 1rem;
    }
  </style>
</head>

<body>

<header>
  <div class="logo-container">
    <span class="logo-star">★</span>
    <span class="logo-text">Bright Finds</span>
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="store.html">Store</a></li>
      <li>
        <button id="logout-btn" class="cta-btn">
          Logout
        </button>
      </li>
    </ul>
  </nav>
</header>


<main class="dashboard">

  <div class="dashboard-header">
    <h1>Seller Dashboard</h1>
    <p id="welcome-message">
      Loading your account...
    </p>
  </div>


  <!-- Statistics -->

  <div class="dashboard-grid">

    <div class="stat-card">
      <h3>My Products</h3>
      <p id="product-count">0</p>
    </div>

    <div class="stat-card">
      <h3>Orders</h3>
      <p id="order-count">0</p>
    </div>

    <div class="stat-card">
      <h3>Items Sold</h3>
      <p id="items-sold">0</p>
    </div>

    <div class="stat-card">
      <h3>Total Sales</h3>
      <p id="total-sales">₱0.00</p>
    </div>

  </div>


  <!-- My Products -->

  <section class="dashboard-section">

    <h2>My Products</h2>

    <table>

      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Created</th>
        </tr>
      </thead>

      <tbody id="products-table">
        <tr>
          <td colspan="3">
            Loading products...
          </td>
        </tr>
      </tbody>

    </table>

  </section>


  <!-- Sales -->

  <section class="dashboard-section">

    <h2>My Sales / Orders</h2>

    <table>

      <thead>
        <tr>
          <th>Order ID</th>
          <th>Product</th>
          <th>Quantity</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="sales-table">
        <tr>
          <td colspan="6">
            Loading sales...
          </td>
        </tr>
      </tbody>

    </table>

  </section>


  <a href="store.html" class="cta-btn back-button">
    Back to Store
  </a>

</main>


<script>
  // ---------------------------------------------------------
  // SUPABASE
  // ---------------------------------------------------------

  const SUPABASE_URL =
    'https://qdslzrbnblvyxskicdvm.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_kDlVEfvz_vZOkUdyn--n3w_0ZL3JrI5';

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ---------------------------------------------------------
  // LOAD DASHBOARD
  // ---------------------------------------------------------

  async function loadDashboard() {

    try {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      // Not logged in
      if (!session?.user) {

        window.location.href =
          'index.html';

        return;

      }


      const user =
        session.user;


      document.getElementById(
        'welcome-message'
      ).textContent =
        `Welcome, ${
          user.user_metadata?.full_name ||
          user.email
        }!`;


      // -----------------------------------------------------
      // PRODUCTS
      // -----------------------------------------------------

      const {
        data: products,
        error: productsError
      } =
        await supabaseClient
          .from('products')
          .select(
            'id,title,price,created_at'
          )
          .eq(
            'seller_id',
            user.id
          )
          .order(
            'created_at',
            {
              ascending: false
            }
          );


      if (productsError) {
        throw productsError;
      }


      document.getElementById(
        'product-count'
      ).textContent =
        products?.length || 0;


      const productsTable =
        document.getElementById(
          'products-table'
        );


      if (!products?.length) {

        productsTable.innerHTML = `
          <tr>
            <td colspan="3" class="empty-message">
              You haven't listed any products yet.
            </td>
          </tr>
        `;

      } else {

        productsTable.innerHTML =
          products.map(
            product => `

              <tr>

                <td>
                  ${escapeHTML(
                    product.title ||
                    'Untitled Product'
                  )}
                </td>

                <td>
                  ₱${Number(
                    product.price || 0
                  ).toFixed(2)}
                </td>

                <td>
                  ${formatDate(
                    product.created_at
                  )}
                </td>

              </tr>

            `
          ).join('');

      }


      // -----------------------------------------------------
      // SALES
      // -----------------------------------------------------

      const {
        data: sales,
        error: salesError
      } =
        await supabaseClient
          .from('order_items')
          .select(`
            id,
            order_id,
            product_id,
            price,
            quantity,
            seller_id,
            products (
              title
            ),
            orders (
              status,
              created_at
            )
          `)
          .eq(
            'seller_id',
            user.id
          )
          .order(
            'id',
            {
              ascending: false
            }
          );


      if (salesError) {
        throw salesError;
      }


      document.getElementById(
        'order-count'
      ).textContent =
        new Set(
          (sales || []).map(
            sale => sale.order_id
          )
        ).size;


      const totalItems =
        (sales || []).reduce(
          (sum, sale) =>
            sum +
            Number(
              sale.quantity || 0
            ),
          0
        );


      document.getElementById(
        'items-sold'
      ).textContent =
        totalItems;


      const totalSales =
        (sales || [])
          .filter(
            sale =>
              sale.orders?.status ===
              'paid'
          )
          .reduce(
            (sum, sale) =>
              sum +
              (
                Number(
                  sale.price || 0
                ) *
                Number(
                  sale.quantity || 0
                )
              ),
            0
          );


      document.getElementById(
        'total-sales'
      ).textContent =
        `₱${totalSales.toFixed(2)}`;


      const salesTable =
        document.getElementById(
          'sales-table'
        );


      if (!sales?.length) {

        salesTable.innerHTML = `
          <tr>
            <td colspan="6" class="empty-message">
              No sales recorded yet.
            </td>
          </tr>
        `;

      } else {

        salesTable.innerHTML =
          sales.map(
            sale => {

              const productName =
                sale.products?.title ||
                'Unknown Product';

              const status =
                sale.orders?.status ||
                'pending';

              const amount =
                Number(
                  sale.price || 0
                ) *
                Number(
                  sale.quantity || 0
                );


              return `

                <tr>

                  <td>
                    ${String(
                      sale.order_id
                    ).substring(0, 8)}...
                  </td>

                  <td>
                    ${escapeHTML(
                      productName
                    )}
                  </td>

                  <td>
                    ${sale.quantity}
                  </td>

                  <td>
                    ₱${amount.toFixed(2)}
                  </td>

                  <td>
                    <span class="status">
                      ${escapeHTML(
                        status
                      )}
                    </span>
                  </td>

                  <td>
                    ${formatDate(
                      sale.orders?.created_at
                    )}
                  </td>

                </tr>

              `;

            }
          ).join('');

      }


    } catch (error) {

      console.error(
        'Dashboard error:',
        error
      );

      document.getElementById(
        'welcome-message'
      ).textContent =
        'Unable to load dashboard data.';

    }

  }


  // ---------------------------------------------------------
  // LOGOUT
  // ---------------------------------------------------------

  document.getElementById(
    'logout-btn'
  ).addEventListener(
    'click',
    async () => {

      await supabaseClient.auth.signOut();

      window.location.href =
        'index.html';

    }
  );


  // ---------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------

  function formatDate(date) {

    if (!date) {
      return '—';
    }

    return new Date(
      date
    ).toLocaleDateString();

  }


  function escapeHTML(value) {

    return String(
      value ?? ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  // ---------------------------------------------------------
  // START
  // ---------------------------------------------------------

  loadDashboard();

</script>

</body>
</html>
